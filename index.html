<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<link rel="manifest" href="./manifest.json">

<link
  rel="apple-touch-icon"
  href="./apple-touch-icon.png"
  >

<link rel="icon" type="image/png" href="./favicon.png">

<title>IPMA Radar</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  crossorigin=""
>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #fff;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* ==========================================================
   HEADER
   ========================================================== */

#header {
  flex: 0 0 auto;
  width: 100%;
  background: #fff;
  border-bottom: 1px solid #ddd;
  padding: 8px 10px;
  z-index: 1000;
}

#controls {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
}

#title {
  font-size: 17px;
  font-weight: 600;
  white-space: nowrap;
  margin-right: 2px;
}

select {
  height: 34px;
  border: 1px solid #bbb;
  border-radius: 6px;
  background: #fff;
  padding: 0 7px;
  font-size: 14px;
  color: #222;
}

#historySelect {
  min-width: 92px;
}

#intervalSelect {
  min-width: 100px;
}

.control-button {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  padding: 0;
  border: 1px solid #bbb;
  border-radius: 6px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #222;
  -webkit-tap-highlight-color: transparent;
}

.control-button:hover {
  background: #f3f3f3;
}

.control-button:active {
  background: #e8e8e8;
}

.control-button svg {
  width: 19px;
  height: 19px;
  display: block;
}


/* ==========================================================
   MAP
   ========================================================== */

#map {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
}

.leaflet-control-zoom a {
  width: 34px !important;
  height: 34px !important;
  line-height: 34px !important;
  font-size: 20px !important;
}


/* ==========================================================
   LOCATION CONTROL
   ========================================================== */

.location-control {
  width: 34px;
  height: 34px;
  background: #fff;
  border: 2px solid rgba(0,0,0,.2);
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.location-control:hover {
  background: #f4f4f4;
}

.location-control svg {
  width: 19px;
  height: 19px;
}


/* ==========================================================
   STATUS
   ========================================================== */


/* ==========================================================
   RADAR LEGEND
   ========================================================== */

#radarLegend {
  position: absolute;
  left: 10px;
  bottom: 10px;
  z-index: 1000;

  display: flex;
  flex-direction: column;
  align-items: flex-start;

  padding: 6px 7px;

  background: rgba(255, 255, 255, 0.35);
  border-radius: 5px;

  font-size: 10px;
  line-height: 1;
}

.legendTitle {
  margin-bottom: 4px;
  font-weight: 600;
}

.legendScale {
  display: flex;
  align-items: stretch;
}

.legendBar {
  width: 14px;
  height: 238px;

  background: linear-gradient(
    to top,
    #0000ff 0%,
    #00ffff 18%,
    #00ff00 38%,
    #ffff00 58%,
    #ff8000 75%,
    #ff0000 88%,
    #ff00ff 100%
  );

  border-radius: 2px;
}

.legendLabels {
  height: 238px;
  margin-left: 5px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
}


#status {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  z-index: 1100;
  background: rgba(255,255,255,.92);
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 12px;
  color: #333;
  pointer-events: none;
  display: none;
  white-space: nowrap;
}


/* ==========================================================
   FRAME COUNTER
   ========================================================== */

#frameCounter {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  z-index: 1050;

  background: rgba(255,255,255,.88);
  border: 1px solid rgba(0,0,0,.20);
  border-radius: 5px;

  padding: 4px 8px;

  font-size: 12px;
  color: #333;

  pointer-events: none;
  white-space: nowrap;

  display: none;
}


/* ==========================================================
   MOBILE
   ========================================================== */

@media (max-width:600px) {

  #header {
    padding: 6px 7px;
  }

  #controls {
    gap: 4px;
  }

  #title {
    font-size: 15px;
  }

  select {
    height: 32px;
    font-size: 13px;
    padding-left: 5px;
    padding-right: 4px;
  }

  #historySelect {
    min-width: 76px;
  }

  #intervalSelect {
    min-width: 82px;
  }

  .control-button {
    width: 32px;
    height: 32px;
    flex-basis: 32px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="header">

    <div id="controls">

      <div id="title">IPMA Radar</div>

      <select
        id="historySelect"
        aria-label="Radar history"
      >
        <option value="1">1 h</option>
        <option value="2">2 h</option>
        <option value="3" selected>3 h</option>
      </select>

      <select
        id="intervalSelect"
        aria-label="Frame interval"
      >
        <option value="5" selected>5 min</option>
        <option value="10">10 min</option>
        <option value="15">15 min</option>
        <option value="20">20 min</option>
      </select>

      
      <!-- REFRESH -->

      <button
        id="refreshButton"
        class="control-button"
        type="button"
        aria-label="Refresh radar"
        title="Refresh"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <path d="M20 11a8.1 8.1 0 0 0-15.5-3M4 5v4h4"></path>

          <path d="M4 13a8.1 8.1 0 0 0 15.5 3M20 19v-4h-4"></path>

        </svg>

      </button>


      <!-- PREVIOUS -->

      <button
        id="previousButton"
        class="control-button"
        type="button"
        aria-label="Previous radar frame"
        title="Previous"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="11 17 6 12 11 7"></polyline>
          <line x1="18" y1="12" x2="6" y2="12"></line>
        </svg>

      </button>


      <!-- PLAY / PAUSE -->

      <button
        id="playButton"
        class="control-button"
        type="button"
        aria-label="Play radar animation"
        title="Play"
      >

        <svg
          id="playIcon"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <polygon points="8,5 19,12 8,19"></polygon>
        </svg>

        <svg
          id="pauseIcon"
          viewBox="0 0 24 24"
          fill="currentColor"
          style="display:none"
        >
          <rect x="6" y="5" width="4" height="14"></rect>
          <rect x="14" y="5" width="4" height="14"></rect>
        </svg>

      </button>


      <!-- NEXT -->

      <button
        id="nextButton"
        class="control-button"
        type="button"
        aria-label="Next radar frame"
        title="Next"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="13 7 18 12 13 17"></polyline>
          <line x1="6" y1="12" x2="18" y2="12"></line>
        </svg>

      </button>

    </div>

  </div>


  <div id="map"></div>

  <!-- RADAR LEGEND -->
  <div id="radarLegend">
    <div class="legendTitle">mm/h</div>

    <div class="legendScale">
      <div class="legendBar"></div>

      <div class="legendLabels">
        <span>&gt;300</span>
        <span>200</span>
        <span>100</span>
        <span>70</span>
        <span>50</span>
        <span>40</span>
        <span>30</span>
        <span>20</span>
        <span>10</span>
        <span>8</span>
        <span>6</span>
        <span>4</span>
        <span>3</span>
        <span>2</span>
        <span>1</span>
        <span>0.5</span>
        <span>0.1</span>
      </div>
    </div>
  </div>

  <div id="status"></div>

  <div id="frameCounter"></div>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  crossorigin=""
></script>


<script>
"use strict";


/* ==========================================================
   IPMA RADAR
   ========================================================== */

const RADAR_BASE_URL =
  "https://www.ipma.pt/resources.www/transf/radar/por/";


/*
 * These are IPMA's own radar image bounds.
 */
const RADAR_BOUNDS = [
  [34.011513, -12.454795],
  [43.792862, -4.345465]
];


/*
 * IPMA radar production interval.
 */
const IPMA_FRAME_MINUTES = 5;


/*
 * Playback speed.

 * This is deliberately much faster than the real-world
 * interval represented by each frame. The result is a
 * smooth time-lapse rather than a frame-by-frame slideshow.
 */
const PLAYBACK_DELAY = 180;


/*
 * Santa Rita fallback location.

 * Zoom is deliberately TWO levels farther out than the
 * previous version.
 */
const DEFAULT_LOCATION = {
  lat: 39.0867,
  lon: -9.3777,
  zoom: 7
};


/* ==========================================================
   APPLICATION STATE
   ========================================================== */

let map = null;


/*
 * Instead of one ImageOverlay, we maintain one already-loaded
 * ImageOverlay for every radar frame.

 * This is the important change for smooth playback.
 */
let radarOverlays = [];


let radarFrames = [];


let currentFrameIndex = 0;


let playing = false;


let playbackTimer = null;


let playbackView = null;


let loadGeneration = 0;


let locationMarker = null;


let locationAccuracy = null;


/*
 * Cache of actual HTMLImageElements.

 * Once an image has loaded and decoded, we keep the element
 * alive. It can therefore be displayed instantly later.
 */
const imageCache = new Map();


/* ==========================================================
   DOM
   ========================================================== */

const historySelect =
  document.getElementById(
    "historySelect"
  );

const intervalSelect =
  document.getElementById(
    "intervalSelect"
  );

const refreshButton =
  document.getElementById(
    "refreshButton"
  );


const previousButton =
  document.getElementById(
    "previousButton"
  );

const playButton =
  document.getElementById(
    "playButton"
  );

const nextButton =
  document.getElementById(
    "nextButton"
  );

const playIcon =
  document.getElementById(
    "playIcon"
  );

const pauseIcon =
  document.getElementById(
    "pauseIcon"
  );

const statusElement =
  document.getElementById(
    "status"
  );

const frameCounter =
  document.getElementById(
    "frameCounter"
  );


/* ==========================================================
   STATUS
   ========================================================== */

function showStatus(message) {

  statusElement.textContent =
    message;

  statusElement.style.display =
    "block";
}


function hideStatus() {

  statusElement.style.display =
    "none";
}


/* ==========================================================
   FRAME COUNTER
   ========================================================== */

function updateFrameCounter() {

  if (!radarFrames.length) {

    frameCounter.style.display =
      "none";

    return;
  }

  const frame =
    radarFrames[currentFrameIndex];

  /*
   * Convert the IPMA UTC timestamp to Lisbon local time.
   *
   * Europe/Lisbon automatically handles daylight saving:
   *   winter = UTC
   *   summer = UTC+1
   */

  const localTime =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone: "Europe/Lisbon",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    ).format(frame.date);

  frameCounter.textContent =
    "Image " +
    (currentFrameIndex + 1) +
    " of " +
    radarFrames.length +
    " · " +
    localTime;

  frameCounter.style.display =
    "block";
}


/* ==========================================================
   MAP INITIALIZATION
   ========================================================== */

function initializeMap() {

  map =
    L.map(
      "map",
      {
        zoomAnimation:false,
        fadeAnimation:false,
        markerZoomAnimation:false
      }
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,

      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }
  ).addTo(map);


  map.setView(
    [
      DEFAULT_LOCATION.lat,
      DEFAULT_LOCATION.lon
    ],
    DEFAULT_LOCATION.zoom,
    {
      animate:false
    }
  );


  addLocationControl();


  setTimeout(
    function() {

      map.invalidateSize(false);

    },
    50
  );
}


/* ==========================================================
   LOCATION CONTROL
   ========================================================== */

function addLocationControl() {

  const LocationControl =
    L.Control.extend({

      options:{
        position:"topright"
      },


      onAdd:function() {

        const button =
          L.DomUtil.create(
            "button",
            "location-control"
          );


        button.type =
          "button";


        button.title =
          "Current location";


        button.setAttribute(
          "aria-label",
          "Current location"
        );


        button.innerHTML = `
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3"></circle>
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
          </svg>
        `;


        L.DomEvent.disableClickPropagation(
          button
        );


        L.DomEvent.on(
          button,
          "click",
          function() {

            useCurrentLocation({
              silent:false
            });

          }
        );


        return button;
      }

    });


  map.addControl(
    new LocationControl()
  );
}


/* ==========================================================
   CURRENT LOCATION
   ========================================================== */

function useCurrentLocation(
  options = {}
) {

  const silent =
    options.silent === true;


  if (!navigator.geolocation) {

    if (!silent) {

      alert(
        "Geolocation is not available in this browser."
      );

    }

    return;
  }


  if (!silent) {

    showStatus(
      "Finding your location…"
    );

  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;


      if (locationMarker) {

        map.removeLayer(
          locationMarker
        );

      }


      if (locationAccuracy) {

        map.removeLayer(
          locationAccuracy
        );

      }


      locationAccuracy =
        L.circle(
          [lat,lon],
          {
            radius:accuracy,
            weight:1,
            fillOpacity:.08
          }
        ).addTo(map);


      locationMarker =
        L.circleMarker(
          [lat,lon],
          {
            radius:6,
            weight:2,
            fillOpacity:.9
          }
        ).addTo(map);


      /*
       * Previous minimum zoom was 11.

       * We now go 3 levels farther out: 8.
       */
      map.setView(
        [lat,lon],
        Math.max(
          map.getZoom(),
          8
        ),
        {
          animate:false
        }
      );


      if (!silent) {
        hideStatus();
      }

    },


    function() {

      if (!silent) {

        hideStatus();

        alert(
          "Unable to determine your location."
        );

      }

    },


    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:300000
    }

  );
}


/* ==========================================================
   RADAR FILENAME
   ========================================================== */

function radarFilename(date) {

  const yyyy =
    date.getUTCFullYear();

  const mm =
    String(
      date.getUTCMonth()+1
    ).padStart(2,"0");

  const dd =
    String(
      date.getUTCDate()
    ).padStart(2,"0");

  const hh =
    String(
      date.getUTCHours()
    ).padStart(2,"0");

  const min =
    String(
      date.getUTCMinutes()
    ).padStart(2,"0");


  return (
    "pcr-" +
    yyyy +
    "-" +
    mm +
    "-" +
    dd +
    "T" +
    hh +
    min +
    ".png"
  );
}


function radarURL(date) {

  return (
    RADAR_BASE_URL +
    radarFilename(date)
  );
}


/* ==========================================================
   FIVE-MINUTE TIME GRID
   ========================================================== */

function floorToFiveMinutes(date) {

  const d =
    new Date(date);

  d.setUTCSeconds(
    0,
    0
  );

  d.setUTCMinutes(
    Math.floor(
      d.getUTCMinutes() /
      IPMA_FRAME_MINUTES
    ) *
    IPMA_FRAME_MINUTES
  );

  return d;
}


/* ==========================================================
   TEST RADAR IMAGE
   ========================================================== */

function testImage(url) {

  return new Promise(
    function(resolve) {

      const img =
        new Image();


      img.onload =
        function() {

          resolve(true);

        };


      img.onerror =
        function() {

          resolve(false);

        };


      img.src =
        url;

    }
  );
}


/* ==========================================================
   FIND LATEST AVAILABLE FRAME
   ========================================================== */

async function findLatestFrame() {

  let candidate =
    floorToFiveMinutes(
      new Date()
    );


  /*
   * IPMA radar production can lag the clock.

   * Look backward up to 30 minutes.
   */

  for (
    let i = 0;
    i <= 6;
    i++
  ) {

    const url =
      radarURL(candidate);


    if (
      imageCache.has(url)
    ) {

      return candidate;

    }


    const exists =
      await testImage(url);


    if (exists) {

      return candidate;

    }


    candidate =
      new Date(
        candidate.getTime() -
        IPMA_FRAME_MINUTES *
        60 *
        1000
      );
  }


  return null;
}


/* ==========================================================
   BUILD FRAME LIST
   ========================================================== */

async function buildFrameList(
  historyHours,
  intervalMinutes,
  generation
) {

  const newest =
    await findLatestFrame();


  if (
    !newest ||
    generation !== loadGeneration
  ) {

    return [];

  }


  /*
   * For example:

   * 3 hours / 5 minutes = 36 intervals

   * Including both endpoints:
   * 37 images
   */

  const frameCount =
    Math.floor(
      historyHours *
      60 /
      intervalMinutes
    );


  const frames = [];


  /*
   * Oldest -> newest
   */

  for (
    let i = frameCount;
    i >= 0;
    i--
  ) {

    if (
      generation !== loadGeneration
    ) {

      return [];

    }


    const date =
      new Date(
        newest.getTime() -
        i *
        intervalMinutes *
        60 *
        1000
      );


    frames.push({
      date:date,
      url:radarURL(date),
      loaded:false
    });

  }


  return frames;
}


/* ==========================================================
   PRELOAD / DECODE FRAME
   ========================================================== */

function preloadFrame(frame) {

  /*
   * If the image is already cached as an HTMLImageElement,
   * use that exact element.
   */

  if (
    imageCache.has(frame.url)
  ) {

    frame.image =
      imageCache.get(
        frame.url
      );

    frame.loaded = true;

    return Promise.resolve(
      frame.image
    );
  }


  return new Promise(
    function(resolve) {

      const img =
        new Image();


      /*
       * Prevent the browser from lazily decoding this image.
       */

      img.decoding =
        "sync";


      img.onload =
        async function() {

          /*
           * decode() ensures that the bitmap is actually
           * decoded before we put it into the animation.
           */

          try {

            if (img.decode) {

              await img.decode();

            }

          } catch(e) {

            /*
             * The image is still valid even if decode()
             * rejects on a particular browser.
             */

          }


          imageCache.set(
            frame.url,
            img
          );


          frame.image =
            img;

          frame.loaded =
            true;


          resolve(img);

        };


      img.onerror =
        function() {

          frame.loaded =
            false;

          resolve(null);

        };


      img.src =
        frame.url;

    }
  );
}


/* ==========================================================
   PRELOAD ALL FRAMES
   ========================================================== */

async function preloadFrames(
  frames,
  generation
) {

  /*
   * Four simultaneous requests avoids hammering IPMA while
   * still filling the browser cache quickly.
   */

  const batchSize = 4;


  for (
    let i = 0;
    i < frames.length;
    i += batchSize
  ) {

    if (
      generation !== loadGeneration
    ) {

      return;

    }


    const batch =
      frames.slice(
        i,
        i + batchSize
      );


    await Promise.all(
      batch.map(
        preloadFrame
      )
    );


    /*
     * Show useful progress during initial loading.
     */

    const loaded =
      frames.filter(
        frame => frame.loaded
      ).length;


    showStatus(
      "Loading radar " +
      loaded +
      " of " +
      frames.length +
      "…"
    );

  }
}


/* ==========================================================
   REMOVE OLD RADAR OVERLAYS
   ========================================================== */

function removeRadarOverlays() {

  for (
    const overlay of radarOverlays
  ) {

    if (
      map.hasLayer(overlay)
    ) {

      map.removeLayer(
        overlay
      );

    }

  }


  radarOverlays = [];
}


/* ==========================================================
   CREATE RADAR OVERLAYS
   ========================================================== */

function createRadarOverlays() {

  removeRadarOverlays();


  /*
   * Create ONE Leaflet ImageOverlay per frame.

   * Every image is therefore already loaded, decoded, and
   * positioned by Leaflet before playback begins.

   * During playback we merely change opacity.
   */

  for (
    let i = 0;
    i < radarFrames.length;
    i++
  ) {

    const frame =
      radarFrames[i];


    const overlay =
      L.imageOverlay(
        frame.url,
        RADAR_BOUNDS,
        {
          opacity:0,
          interactive:false,
          zIndex:100
        }
      );


    overlay.addTo(map);


    radarOverlays.push(
      overlay
    );

  }


  /*
   * Make only the current frame visible.
   */

  setVisibleFrame(
    currentFrameIndex
  );
}


/* ==========================================================
   SHOW ONE FRAME
   ========================================================== */

function setVisibleFrame(index) {

  if (
    index < 0 ||
    index >= radarOverlays.length
  ) {

    return;

  }


  /*
   * Only change opacity.

   * No new network request.
   * No new image decode.
   * No new overlay creation.
   * No map movement.
   */

  for (
    let i = 0;
    i < radarOverlays.length;
    i++
  ) {

    radarOverlays[i].setOpacity(
      i === index
        ? .80
        : 0
    );

  }


  currentFrameIndex =
    index;


  updateFrameCounter();
}


/* ==========================================================
   REBUILD RADAR
   ========================================================== */

async function rebuildRadar() {

  stopPlayback(false);

  const previousNewestTime =
  radarFrames.length
    ? radarFrames[radarFrames.length - 1].date.getTime()
    : null;


  const generation =
    ++loadGeneration;


  showStatus(
    "Loading radar…"
  );


  try {

    const historyHours =
      Number(
        historySelect.value
      );


    const intervalMinutes =
      Number(
        intervalSelect.value
      );


    let frames =
      await buildFrameList(
        historyHours,
        intervalMinutes,
        generation
      );


    if (
      generation !== loadGeneration
    ) {

      return;

    }


    if (!frames.length) {

      throw new Error(
        "No current IPMA radar frame is available."
      );

    }


    /*
     * Load and decode every frame before constructing the
     * animation.
     */

    await preloadFrames(
      frames,
      generation
    );


    if (
      generation !== loadGeneration
    ) {

      return;

    }


    /*
     * Remove frames which IPMA did not actually supply.
     */

    frames =
      frames.filter(
        frame => frame.loaded
      );


    if (!frames.length) {

      throw new Error(
        "No radar images could be loaded."
      );

    }


    radarFrames =
      frames;


    /*
     * Start on newest frame.
     */

    currentFrameIndex =
      radarFrames.length - 1;


    /*
     * Create the complete set of Leaflet overlays.
     */

    createRadarOverlays();


    updateFrameCounter();

    const newNewestTime =
      radarFrames[radarFrames.length - 1].date.getTime();

    if (
      previousNewestTime !== null &&
      newNewestTime === previousNewestTime
    ) {
      showStatus(
        "Radar is current"
      );

      setTimeout(
        hideStatus,
        2500
      );
    } else {
      hideStatus();
    }

  } catch(error) {

    console.error(
      "Radar error:",
      error
    );


    if (
      generation === loadGeneration
    ) {

      showStatus(
        "Unable to load radar."
      );


      setTimeout(
        hideStatus,
        3000
      );

    }

  }
}


/* ==========================================================
   PLAY / PAUSE UI
   ========================================================== */

function setPlayingUI(value) {

  playing =
    value;


  playIcon.style.display =
    value
      ? "none"
      : "block";


  pauseIcon.style.display =
    value
      ? "block"
      : "none";


  playButton.title =
    value
      ? "Pause"
      : "Play";


  playButton.setAttribute(
    "aria-label",
    value
      ? "Pause radar animation"
      : "Play radar animation"
  );
}


/* ==========================================================
   STOP PLAYBACK
   ========================================================== */

function stopPlayback(
  restoreView = true
) {

  if (
    playbackTimer !== null
  ) {

    clearTimeout(
      playbackTimer
    );

    playbackTimer =
      null;
  }


  if (playing) {

    setPlayingUI(false);

  }


  if (
    restoreView &&
    playbackView
  ) {

    map.setView(
      playbackView.center,
      playbackView.zoom,
      {
        animate:false
      }
    );

  }


  playbackView =
    null;
}


/* ==========================================================
   START PLAYBACK
   ========================================================== */

function startPlayback() {

  if (
    radarFrames.length < 2
  ) {

    return;

  }


  if (playing) {

    return;

  }


  /*
   * Remember the exact map position.
   */

  playbackView = {
    center:map.getCenter(),
    zoom:map.getZoom()
  };


  /*
   * Start with the oldest frame.
   */

  currentFrameIndex =
    0;


  setVisibleFrame(
    currentFrameIndex
  );


  setPlayingUI(true);


  scheduleNextFrame();
}


/* ==========================================================
   PLAYBACK LOOP
   ========================================================== */

function scheduleNextFrame() {

  if (!playing) {

    return;

  }


  playbackTimer =
    setTimeout(
      function() {

        if (!playing) {

          return;

        }


        const nextIndex =
          currentFrameIndex + 1;


        /*
         * Finished the animation.
         */

        if (
          nextIndex >=
          radarFrames.length
        ) {

          currentFrameIndex =
            radarFrames.length - 1;


          setVisibleFrame(
            currentFrameIndex
          );


          stopPlayback(true);


          return;

        }


        /*
         * THIS IS NOW AN EXTREMELY CHEAP OPERATION.

         * The next image is already decoded and already
         * sitting in a Leaflet overlay.

         * We are simply switching opacity.
         */

        setVisibleFrame(
          nextIndex
        );


        scheduleNextFrame();

      },
      PLAYBACK_DELAY
    );
}


/* ==========================================================
   PREVIOUS FRAME
   ========================================================== */

function showPreviousFrame() {

  stopPlayback(false);


  if (
    !radarFrames.length
  ) {

    return;

  }


  let index =
    currentFrameIndex - 1;


  if (index < 0) {

    index =
      radarFrames.length - 1;

  }


  setVisibleFrame(
    index
  );
}


/* ==========================================================
   NEXT FRAME
   ========================================================== */

function showNextFrame() {

  stopPlayback(false);


  if (
    !radarFrames.length
  ) {

    return;

  }


  let index =
    currentFrameIndex + 1;


  if (
    index >= radarFrames.length
  ) {

    index = 0;

  }


  setVisibleFrame(
    index
  );
}


/* ==========================================================
   EVENTS
   ========================================================== */

historySelect.addEventListener(
  "change",
  function() {

    rebuildRadar();

  }
);


intervalSelect.addEventListener(
  "change",
  function() {

    rebuildRadar();

  }
);

refreshButton.addEventListener(
  "click",
  function() {
    rebuildRadar();
  }
);

previousButton.addEventListener(
  "click",
  function() {

    showPreviousFrame();

  }
);


nextButton.addEventListener(
  "click",
  function() {

    showNextFrame();

  }
);


playButton.addEventListener(
  "click",
  function() {

    if (playing) {

      stopPlayback(true);

    } else {

      startPlayback();

    }

  }
);


/* ==========================================================
   INITIALIZATION
   ========================================================== */

async function initialize() {

  initializeMap();


  /*
   * Santa Rita is the immediate fallback.
   */

  map.setView(
    [
      DEFAULT_LOCATION.lat,
      DEFAULT_LOCATION.lon
    ],
    DEFAULT_LOCATION.zoom,
    {
      animate:false
    }
  );


  /*
   * Try the user's actual location.

   * If permission is denied or unavailable, Santa Rita
   * remains the fallback.
   */

  useCurrentLocation({
    silent:true
  });


  /*
   * Load the radar.
   */

  await rebuildRadar();
}


/* ==========================================================
   START
   ========================================================== */

initialize();

</script>
